[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for any path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set VITE_API_FOOTBALL_KEY (and optionally the league/team/season/cache vars)
# in Netlify's Site settings → Environment variables to enable live data.
